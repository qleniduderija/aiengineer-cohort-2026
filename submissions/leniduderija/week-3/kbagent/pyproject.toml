[project]
name = "kbagent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Leni Đuderija", email = "leni.duderija@q.agency" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.4.0",
    "fastapi>=0.141.1",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.5",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "sentence-transformers>=6.0.1",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
kbagent = "kbagent:main"
kbagent-web = "kbagent.web:serve"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
