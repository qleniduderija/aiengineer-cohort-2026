<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>kbagent</title>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 16px; }
  h1 { font-size: 1.1rem; color: #444; }
  #log { border: 1px solid #ddd; border-radius: 8px; padding: 16px; height: 60vh; overflow-y: auto; margin-bottom: 12px; }
  .msg { margin-bottom: 16px; white-space: pre-wrap; }
  .msg.user { color: #333; font-weight: 600; }
  .msg.assistant { color: #111; }
  .sources { font-size: 0.8rem; color: #777; margin-top: 6px; }
  .sources a { color: #777; }
  form { display: flex; gap: 8px; }
  input { flex: 1; padding: 10px; font-size: 1rem; border: 1px solid #ccc; border-radius: 6px; }
  button { padding: 10px 16px; font-size: 1rem; border: none; border-radius: 6px; background: #333; color: white; cursor: pointer; }
  button:disabled { background: #999; }
</style>
</head>
<body>

<h1>kbagent — Q knowledge base assistant</h1>
<div id="log"></div>
<form id="form">
  <input id="question" type="text" placeholder="Ask something about Q's processes, policies, or standards..." autocomplete="off" />
  <button id="submit" type="submit">Ask</button>
</form>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("question");
const submitBtn = document.getElementById("submit");

function addMessage(role, text) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.textContent = text;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
  return div;
}

function addSources(sources) {
  const div = document.createElement("div");
  div.className = "sources";
  div.innerHTML = "Sources: " + sources.map(s => `<a href="${s.url}" target="_blank">${s.path}</a>`).join(" · ");
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const question = input.value.trim();
  if (!question) return;

  addMessage("user", question);
  input.value = "";
  submitBtn.disabled = true;
  const pending = addMessage("assistant", "…");

  try {
    const response = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question }),
    });
    const data = await response.json();
    pending.textContent = data.answer;
    if (data.sources && data.sources.length) {
      addSources(data.sources);
    }
  } catch (err) {
    pending.textContent = "[Error: could not reach the server]";
  } finally {
    submitBtn.disabled = false;
    input.focus();
  }
});
</script>

</body>
</html>
